<!DOCTYPE html>
<html>
<head>
    <title>Backend Connection Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test { padding: 15px; margin: 10px 0; border-radius: 8px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; }
        .loading { background: #d1ecf1; border: 1px solid #bee5eb; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔌 Backend Connection Test</h1>
    <p>Testing connection to <strong>http://localhost:8000</strong></p>
    
    <button onclick="testConnection()">Test Connection</button>
    <button onclick="testTickets()">Test Get Tickets</button>
    <button onclick="testStats()">Test Get Stats</button>
    
    <div id="results"></div>

    <script>
        const API_BASE = 'http://localhost:8000';
        const resultsDiv = document.getElementById('results');

        function addResult(message, type = 'success') {
            const div = document.createElement('div');
            div.className = `test ${type}`;
            div.innerHTML = message;
            resultsDiv.appendChild(div);
        }

        async function testConnection() {
            resultsDiv.innerHTML = '';
            addResult('Testing basic connection...', 'loading');
            
            try {
                const response = await fetch(`${API_BASE}/`);
                const data = await response.json();
                addResult(`✅ Backend Connected!<pre>${JSON.stringify(data, null, 2)}</pre>`, 'success');
            } catch (error) {
                addResult(`❌ Connection Failed: ${error.message}<br>Make sure backend is running on port 8000`, 'error');
            }
        }

        async function testTickets() {
            addResult('Fetching tickets...', 'loading');
            
            try {
                const response = await fetch(`${API_BASE}/tickets`);
                const data = await response.json();
                addResult(`✅ Got ${data.length} tickets<pre>${JSON.stringify(data.slice(0, 2), null, 2)}</pre>`, 'success');
            } catch (error) {
                addResult(`❌ Failed to fetch tickets: ${error.message}`, 'error');
            }
        }

        async function testStats() {
            addResult('Fetching system stats...', 'loading');
            
            try {
                const response = await fetch(`${API_BASE}/stats`);
                const data = await response.json();
                addResult(`✅ System Stats<pre>${JSON.stringify(data, null, 2)}</pre>`, 'success');
            } catch (error) {
                addResult(`❌ Failed to fetch stats: ${error.message}`, 'error');
            }
        }

        // Auto-test on load
        window.addEventListener('load', () => {
            setTimeout(testConnection, 500);
        });
    </script>
</body>
</html>
